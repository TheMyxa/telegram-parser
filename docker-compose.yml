name: tg

services:
  dashboard:
    build: .
    image: tg:latest
    environment:
      TG_ENV_FILE: /workspace/.env
      TG_BOOTSTRAP_ENV: "1"
    command: ["dashboard"]
    ports:
      - "9595:9595"
    volumes:
      - .:/workspace
      - ./data:/app/data
      - ./sessions:/app/sessions
    restart: unless-stopped

  cli:
    build: .
    image: tg:latest
    environment:
      TG_ENV_FILE: /workspace/.env
      TG_BOOTSTRAP_ENV: "1"
    profiles:
      - tools
    volumes:
      - .:/workspace
      - ./data:/app/data
      - ./sessions:/app/sessions
    command: ["--help"]
    stdin_open: true
    tty: true
